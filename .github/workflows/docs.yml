name: Docs

# docs/ holds page.md + page.ru.md; MkDocs + mkdocs-static-i18n build both language
# trees into site_dir: public, which is what GitHub Pages serves.
on:
  pull_request:
    paths:
      - mkdocs.yml
      - docs/**
      - hooks/**
      - ci/check-release-markers.sh
      - Software/Software_ver_2/HAQuDA_Esp32/sketches/HAQuDA_Version.h
      - .github/workflows/docs.yml
  push:
    paths:
      - mkdocs.yml
      - docs/**
      - hooks/**
      - ci/check-release-markers.sh
      - Software/Software_ver_2/HAQuDA_Esp32/sketches/HAQuDA_Version.h
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --strict turns MkDocs warnings into errors. Pages serves one site per repository, so
  # a pull request cannot be previewed there: the artifact of this job is the preview -
  # download it and open public/index.html.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: public
          retention-days: 7

  # A release-notes page for a version that is not out yet carries an "in preparation"
  # banner in place of a release date, tagged with an `<!-- unreleased` comment. That
  # banner must never reach the published site: Pages publishes from the default branch,
  # which is where a release lands, so a published page would deny a version the header
  # stamps as shipped. Blocking the pull request is the point - the release date is known
  # before the merge, so it can be set then, and the run on the default branch never has
  # to fail after the fact. Pull requests into the development branch are not checked -
  # the banner belongs there.
  #
  # Run through `bash` rather than executed directly: this repository is developed on
  # Windows, where the executable bit is easily lost from the index.
  release-markers:
    if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/check-release-markers.sh docs

  # Default branch only: the branch is compared by name at run time because the `on:`
  # filter cannot read repository settings. `main` is the release branch, so the site goes
  # live when Software_Ver_2 is merged into it; nothing is published from other branches.
  build:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # Catches a direct push that bypassed the release-markers job.
      - run: bash ci/check-release-markers.sh docs
      - run: mkdocs build --strict
        env:
          # mkdocs.yml reads site_url from SITE_URL; base_url has no trailing slash.
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a running deployment is finished, not cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
