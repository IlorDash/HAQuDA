<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HAQuDA WiFi manager</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
	<h1>HAQuDA</h1>
	<p class="muted">WiFi manager</p>
</header>
<main>
	<section class="card wide">
		<h2>Add a WiFi network</h2>
		<form id="form" action="/add_wifi_creds" method="POST">
			<label for="ssid">Network name (SSID)</label>
			<input type="text" id="ssid" name="ssid" maxlength="31" required autocomplete="off" autocapitalize="none" spellcheck="false">
			<label for="pass">Password</label>
			<input type="password" id="pass" name="pass" maxlength="31" required autocomplete="off">
			<label class="check"><input type="checkbox" id="showPass"> Show password</label>
			<div class="actions">
				<button class="btn" id="save" type="submit">Save</button>
				<a class="btn danger" href="/">Back</a>
			</div>
		</form>
		<p id="msg" class="muted" role="status"></p>
		<p class="muted">The lamp restarts after it saves the network. Names and passwords take up to 31 bytes.</p>
	</section>
</main>
<script src="/wifi.js"></script>
</body>
</html>
