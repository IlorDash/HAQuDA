<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HAQuDA</title>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hdr">
	<div class="in hdr-in">
		<div class="hdr-l">
			<div class="brand">
				<span class="logo">HAQuDA</span>
				<span class="bars" id="bars"><i></i><i></i><i></i><i></i></span>
			</div>
			<div class="status"><span class="sdot" id="sdot"></span><span id="stext" role="status">Connecting to the lamp&hellip;</span></div>
		</div>
		<div class="hdr-r">
			<div class="seg" role="group" aria-label="Language">
				<button type="button" data-lang="en" aria-pressed="true">EN</button>
				<button type="button" data-lang="ru" aria-pressed="false">RU</button>
			</div>
			<button type="button" class="themebtn" id="theme" aria-label="Toggle theme"><span></span></button>
		</div>
	</div>
</header>
<main class="in">
	<div class="banner" id="banner" hidden>
		<p id="bannerText"></p>
		<a class="cta" id="bannerCta" href="/wifi_manager" data-i="cta" hidden>Add WiFi network</a>
	</div>
	<div class="banner bad" id="lastBanner" hidden>
		<p id="lastBannerText"></p>
		<button type="button" class="bx" id="lastClose" data-i="close">Close</button>
	</div>
	<div class="grid">
		<div class="left">
			<section class="lamp" id="lamp">
				<div class="mrow">
					<div class="matrix" id="matrix" aria-hidden="true"></div>
					<div class="legend" id="legend">
						<div><span></span><b></b></div>
						<div><span></span><b></b></div>
						<div><span></span><b></b></div>
						<p id="legendNote" role="status"></p>
					</div>
				</div>
				<div class="idx">
					<div class="idx-word" id="idxWord">&mdash;</div>
					<div class="idx-sub" id="idxSub"></div>
				</div>
			</section>
			<section class="lc" id="lc" aria-labelledby="lcT" hidden>
				<div class="lc-h">
					<div>
						<div class="lc-t" id="lcT" data-i="lcTitle">Lamp</div>
						<div class="lc-s" id="lcSum"></div>
					</div>
					<button type="button" class="sw" id="lcPower" role="switch" aria-checked="false" aria-label="Power"><i></i></button>
				</div>
				<div class="lc-dep" id="lcDep">
					<div class="fld">
						<div class="fl"><span data-i="lcBright">Brightness</span><b class="mono" id="lcBv"></b></div>
						<input type="range" id="lcRange" min="5" max="100" step="5">
					</div>
					<div class="lc-modes" id="lcModes"></div>
					<div class="lc-set">
						<div class="fld" id="lcStd">
							<div class="fl" data-i="lcRead">Reading</div>
							<div class="chips" id="lcChips"></div>
						</div>
						<div class="lc-set" id="lcMulti"></div>
						<div class="lc-night" id="lcNight">
							<label class="fld"><span class="fl" data-i="lcRead">Reading</span><select class="sel" id="lcNp"></select></label>
							<label class="fld"><span class="fl" data-i="lcFrom">Night light from</span><input class="sel" type="time" id="lcNf"></label>
							<label class="fld"><span class="fl" data-i="lcTo">to</span><input class="sel" type="time" id="lcNt"></label>
							<p class="hint" data-i="lcHint"></p>
						</div>
						<div class="fld" id="lcLight">
							<div class="fl"><span data-i="lcColor">Color</span><b id="lcCn"></b></div>
							<div class="sws" id="lcCols"></div>
						</div>
					</div>
				</div>
				<p class="hint" id="lcNote" role="status"></p>
				<div class="reply bad" id="lcReply" hidden><i></i><span id="lcReplyText"></span></div>
			</section>
		</div>
		<div class="side">
			<div class="tiles" id="tiles"></div>
			<nav class="links">
				<a class="lk" href="/wifi_manager"><span data-i="wifi">WiFi networks</span></a>
				<a class="lk" href="/webserial"><span data-i="log">Live log</span></a>
				<a class="lk ext" href="https://ilordash.github.io/HAQuDA/" target="_blank" rel="noopener"><span data-i="guide">User guide &#8599;</span><span class="note" data-i="offNote">needs internet</span></a>
				<a class="lk ext" href="https://github.com/IlorDash/HAQuDA" target="_blank" rel="noopener"><span>GitHub &#8599;</span><span class="note" data-i="offNote">needs internet</span></a>
			</nav>
			<footer class="meta"><span id="mfw"></span><span id="mip"></span><span id="mup"></span></footer>
		</div>
	</div>
</main>
<script src="/app.js"></script>
</body>
</html>
