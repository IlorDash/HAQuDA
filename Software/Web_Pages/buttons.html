<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HAQuDA touch buttons</title>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="btnpg">
<header class="hdr">
	<div class="in hdr-in">
		<div class="hdr-l">
			<div class="brand">
				<span class="logo">HAQuDA</span>
				<span class="bars" id="bars"><i></i><i></i><i></i><i></i></span>
			</div>
			<div class="status"><span class="sdot" id="sdot"></span><span id="stext" role="status">Connecting to the lamp&hellip;</span></div>
		</div>
		<div class="hdr-r">
			<div class="seg" role="group" aria-label="Language">
				<button type="button" data-lang="en" aria-pressed="true">EN</button>
				<button type="button" data-lang="ru" aria-pressed="false">RU</button>
			</div>
			<button type="button" class="themebtn" id="theme" aria-label="Toggle theme"><span></span></button>
		</div>
	</div>
</header>
<main class="in">
	<div class="pgt">
		<a class="back" href="/" aria-label="Main page">&larr;</a>
		<h1 data-i="title">Touch buttons</h1>
	</div>
	<section class="card lockc" id="lockCard" aria-labelledby="lockT">
		<div class="lock-h">
			<div class="lock-x">
				<div class="card-t" id="lockT" data-i="lockTitle">Lock the buttons</div>
				<div class="hint" id="lockS"></div>
			</div>
			<button type="button" class="sw" id="lockSw" role="switch" aria-checked="false" aria-labelledby="lockT"><i></i></button>
		</div>
	</section>
	<div id="bwrap">
		<div class="bcols">
			<div class="bleft">
				<section class="card boardc">
					<div class="board" id="board">
						<svg viewBox="0 0 300 300" width="300" height="300"><circle cx="150" cy="150" r="148"></circle></svg>
					</div>
					<div class="hint" data-i="tapHint">Tap a button to choose what it does</div>
				</section>
				<section class="card sys">
					<div class="sh"><span class="card-t" data-i="sysTitle">System gestures</span><span class="hint" data-i="sysTag">always on</span></div>
					<div class="gr"><span class="gk" data-i="g1k">Hold</span><span data-i="g1d"></span></div>
					<div class="gr"><span class="gk" data-i="g2k">6 + 8 &middot; 3 s</span><span data-i="g2d"></span></div>
					<div class="gr"><span class="gk" data-i="g3k">2 + 8 &middot; 10 s</span><span data-i="g3d"></span></div>
				</section>
			</div>
			<section class="card actc" id="actCard">
				<div class="sh"><span class="card-t" id="actT"></span><span class="hint" data-i="onTap">action on tap</span></div>
				<div class="acts" id="acts"></div>
				<div class="warn" id="warn" hidden><i></i><span data-i="warn"></span></div>
				<div class="reply bad" id="reply" role="status" hidden><i></i><span id="replyText"></span></div>
				<div class="foot">
					<span class="hint" id="foot"></span>
					<button type="button" class="ghost" id="reset" data-i="reset">Defaults</button>
				</div>
			</section>
		</div>
	</div>
	<nav class="links">
		<a class="lk" href="/"><span data-i="main">Main page</span></a>
		<a class="lk" href="/wifi_manager"><span data-i="wifi">WiFi networks</span></a>
	</nav>
	<footer class="meta"><span id="mfw"></span><span id="mip"></span></footer>
</main>
<div class="modal" id="modal" hidden>
	<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="mdT" aria-describedby="mdX">
		<h2 id="mdT" data-i="saveTitle">Couldn&rsquo;t save</h2>
		<p id="mdX" data-i="saveText"></p>
		<button type="button" class="submit" id="mdOk" data-i="ok">OK</button>
	</div>
</div>
<script src="/buttons.js"></script>
</body>
</html>
